name: Azure Login for Multiple Subscriptions

on:
  workflow_dispatch:

jobs:
  azure-login:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      #- name: Set up Azure CLI
      #  uses: azure/setup-azurecli@v1

      - name: Login to Azure 
        run: |
          az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET_ }} --tenant ${{ secrets.TENANT_ID }}
          